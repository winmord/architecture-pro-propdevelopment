apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requiredrunasnonroot
spec:
  crd:
    spec:
      names:
        kind: RequiredRunAsNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requiredrunasnonroot

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.runAsNonRoot == true
          msg := sprintf("Container %v in pod %v must set runAsNonRoot=true", [container.name, input.review.object.metadata.name])
        }
        
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.runAsUser == 0
          msg := sprintf("Container %v in pod %v runs as root (UID 0), which is not allowed", [container.name, input.review.object.metadata.name])
        }
        
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("Container %v in pod %v must set readOnlyRootFilesystem=true", [container.name, input.review.object.metadata.name])
        }